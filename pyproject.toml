[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mind"
version = "0.1.0"
description = "AI Multi-Agent Orchestration TUI - Terminal User Interface and MCP bridge for the 'mind' system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Mind Contributors" },
]
keywords = ["ai", "tui", "orchestration", "multi-agent", "mcp", "terminal", "pty", "antigravity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.41.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pyte>=0.8.2",
    "mcp>=1.2.0",
    "psutil>=5.9.0",
    "pyperclip>=1.8.2",
    # Platform-specific PTY dependencies:
    # Windows: pywinpty wraps Windows ConPTY / WinPTY
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    # Linux / Unix: ptyprocess manages forkpty child processes
    # Note: termios is a built-in module in Python's standard library on Unix/Linux
    "ptyprocess>=0.7.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "anyio>=4.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "anyio>=4.0.0",
]

[project.scripts]
mind = "mind.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mind"]

[tool.hatch.build.targets.sdist]
include = ["src/mind"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestConfigWarning",
    "ignore::RuntimeWarning",
]
