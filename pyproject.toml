[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mind-micro"
version = "0.1.0"
description = "AI Multi-Agent Orchestration TUI - Terminal User Interface for the 'mind' system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.41.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.scripts]
micro = "micro.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/micro"]

[tool.hatch.build.targets.sdist]
include = ["src/micro"]
