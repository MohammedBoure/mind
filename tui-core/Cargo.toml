[package]
name = "tui-core"
version = "0.1.0"
edition = "2021"
authors = ["agy11 <systems@mind.ai>"]
description = "High-performance compiled TUI core architecture with async PTY master loop, Tokio event engine, and MCP/IPC bridge."
license = "MIT"
default-run = "agi"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
portable-pty = "0.8"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
vte = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "agi"
path = "src/main.rs"

[[bench]]
name = "benchmarks"
harness = false
